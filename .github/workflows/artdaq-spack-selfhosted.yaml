name: Build artdaq-spack docker image (self hosted)

on:
  schedule:
    - cron: "0 0 * * 4"
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - dockerfiles/artdaq-spack.dockerfile
      - .github/workflows/artdaq-spack-selfhosted.yaml

  workflow_dispatch:

jobs:

  push_to_registries:
    name: Push Docker image to multiple registries
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ '9', '10' ]
        spackVer: [ 'v0.28', 'v1.1' ]
    runs-on: [self-hosted, "alma${{ matrix.os }}"]
    steps:
      - name: Test CVMFS
        id: cvmfsdirs
        run: |
          ls -l /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_${{matrix.spackVer}}
          artdaq=`ls -d /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_${{matrix.spackVer}}/artdaq-*-al${{matrix.os}}|tail -1|sed 's|.*/||g'`
          art=`grep -oE "art-suite-[^/]*/" /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_${{matrix.spackVer}}/${artdaq}/spack/etc/spack/upstreams.yaml|sed 's|/||g'|uniq`

          echo "${art} ${artdaq} ${ots}"
          echo "art=${art}" >> $GITHUB_OUTPUT
          echo "artdaq=${artdaq}" >> $GITHUB_OUTPUT

      - name: Check out the daq-docker repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: art-daq/daq-docker
          path: daq-docker

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GHIO }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            eflumerf/artdaq-spack
            ghcr.io/art-daq/artdaq-spack
          tags: |
            type=raw,value=latest,enable=${{matrix.os == '9' && matrix.spackVer == 'v0.28' }}
            type=raw,value=alma${{matrix.os}}-spack${{matrix.spackVer}}
            type=ref,event=branch
            type=ref,event=tag

      - name: prepare build dir
        run: |
          build_dir="${{ github.workspace }}/docker-build"
          mkdir -p $build_dir
          cd $build_dir
          cp ${{ github.workspace }}/daq-docker/dockerfiles/artdaq-spack.dockerfile $build_dir/Dockerfile
          for d in $build_dir/spack_${{matrix.spackVer}}/art-suite-*-al${{matrix.os}}; do
            [ -d "$d" ] && [ "$(basename $d)" != "${{ steps.cvmfsdirs.outputs.art }}" ] && rm -rf "$d"
          done
          for d in $build_dir/spack_${{matrix.spackVer}}/artdaq-*-al${{matrix.os}}; do
            [ -d "$d" ] && [ "$(basename $d)" != "${{ steps.cvmfsdirs.outputs.artdaq }}" ] && rm -rf "$d"
          done
          rsync --mkpath --progress --delete -ax /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_${{matrix.spackVer}}/${{ steps.cvmfsdirs.outputs.art }}/ $build_dir/spack_${{matrix.spackVer}}/${{ steps.cvmfsdirs.outputs.art }}
          rsync --mkpath --progress --delete -ax /cvmfs/fermilab.opensciencegrid.org/products/artdaq/spack_${{matrix.spackVer}}/${{ steps.cvmfsdirs.outputs.artdaq }}/ $build_dir/spack_${{matrix.spackVer}}/${{ steps.cvmfsdirs.outputs.artdaq }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ github.workspace }}/docker-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ART_AREA=${{ steps.cvmfsdirs.outputs.art }}
            ARTDAQ_AREA=${{ steps.cvmfsdirs.outputs.artdaq }}
            BASE_IMAGE=ghcr.io/art-daq/alma${{ matrix.os }}-spack:latest
            SPACK_VERSION=${{ matrix.spackVer }}
            ARCH=linux-almalinux${{ matrix.os }}-x86_64_v3

      - name: "Cleanup Docker"
        if: always()
        run: |
            docker stop $(docker ps -q) 2>/dev/null
            docker rm -f $(docker ps -aq) 2>/dev/null
            docker rmi -f $(docker images -aq) 2>/dev/null
            docker volume rm -f $(docker volume ls -q) 2>/dev/null
            docker system prune --all --volumes --force
